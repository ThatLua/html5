<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mais Tabelas</title>

    <style>
        caption{
            background-color: black;
            color: white;
        }
        thead{
            background-color: orange;
        }
        tbody{
            background-color: lightgoldenrodyellow;
        }
        tfoot{
            background-color: lightgray;
        }

    </style>

</head>
<body>
    <h1>Exercício</h1>

    <table border="1">
        <caption>Lista de países mais populosos</caption>

        <tbody>
        <tr>

        </tr>
        <tr>
            <td> 2 </td>
            <td> <img src="imagens-países/b1.jpg"> China </td>
            <td> 1.412 </td>
        </tr>
        <tr>
            <td> 3 </td>
            <td> <img src="imagens-países/b3.jpg"> Estados Unidos </td>
            <td> 349 </td>
        </tr>
        <tr>
            <td> 4 </td>
            <td> <img src="imagens-países/b4.jpg"> Indonésia </td>
            <td> 287 </td>
        </tr>
            <tr>
            <td> 5 </td>
            <td> <img src="imagens-países/b5.jpg"> Paquistão </td>

        </tr>
            <tr>
            <td> 6 </td>

        </tr>

        </tbody>

        <tfoot>
            <td colspan="3"> fonte: www.worldometers.info</td>
        </tfoot>

    </table>


</body>
</html>
