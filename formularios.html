<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <h1>Formulários</h1>

    <form action="processa.html" method="post">

    <!-- 
        Email: <br>
        <input type="text" name="email" placeholder="Digite seu email"> <br>
        Senha: <br>
        <input type="password" name="senha" placeholder="Digite sua senha"> <br>
        Comentário: <br>
        <textarea name="comentario" placeholder="Deixe seu comentário!"></textarea>
        <br>
        <button type="reset">
            <img src="imagens/ouricinho.jpg" width="20">
            Entrar
        </button>
        <input type="submit" value="Entrar"> <br>
    -->

    <fieldset>
        <legend>Dados Pessoais</legend>
       <label> Nome: <input type="text" name="nome" placeholder="Digite seu nome"> </label> <br> <br>
       <label for="email"> Email: </label>
       <input type="text" name="email" id="email" placeholder="Ex: rosa@email.com">

       <br>
        Gênero <br>
        <label for="feminino"> <input type="radio" name="genero" value="feminino" id="feminino"> Feminino </label>
        <input type="radio" name="genero" value="masculino" id="masculino"> <label for="masculino"> Masculino </label>
        <input type="radio" name="genero" value="outro" id="outro"> <label for="outro"> Outro </label>

     </fieldset>

        <br><br>

     <fieldset>
        <legend> Dados Adicionais</legend>
        Estilo Musical Preferido <br>
        <input type="checkbox" name="estilo" value="rock" id="rock"> <label for="rock"> Rock </label>
        <input type="checkbox" name="estilo" value="pop" id="pop"> <label for="pop"> Pop </label>
        <input type="checkbox" name="estilo" value="sertanejo" id="sertanejo"> <label for="sertanejo"> Sertanejo </label>
        <br><br>

        Estado:
        <select name="estado">
            <option value="">Selecione</option>
            <option value="ac">Acre</option>
            <option value="am">Amazonas</option>
            <option value="ba">Bahia</option>
            <option value="ce">Ceará</option>
            <option value="mg">Minas Gerais </option>
            <option value="to">Tocantins</option>
        </select>

        <br><br>

        Upload de Arquivo:<br>
        <input type="file" name="arquivo">

    </fieldset>
        <br>
        <input type="submit" value="Cadastrar">

        

    </form>

</body>
</html>
